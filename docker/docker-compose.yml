services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://resumeiq:resumeiq@db:5432/resumeiq
      - SECRET_KEY=change-me-in-prod
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
    depends_on:
      - db
    volumes:
      - faiss_data:/app/data/faiss_index
      - upload_data:/app/data/uploads

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: resumeiq
      POSTGRES_USER: resumeiq
      POSTGRES_PASSWORD: resumeiq
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pg_data:
  faiss_data:
  upload_data:
