<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ResumeIQ — AI Interview Coach</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#040711;--surface:#0b1120;--surface2:#111827;--border:rgba(255,255,255,0.07);--accent:#4f8ef7;--accent2:#a78bfa;--green:#34d399;--orange:#fb923c;--red:#f87171;--text:#e2e8f0;--muted:#64748b;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);}
  body::before{content:'';position:fixed;inset:0;z-index:0;background-image:linear-gradient(rgba(79,142,247,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(79,142,247,0.03) 1px,transparent 1px);background-size:60px 60px;pointer-events:none;}
  nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:1rem 2.5rem;backdrop-filter:blur(20px);background:rgba(4,7,17,0.85);border-bottom:1px solid var(--border);}
  .logo{font-family:'Syne',sans-serif;font-size:1.3rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .btn-sm{background:rgba(79,142,247,0.1);border:1px solid rgba(79,142,247,0.25);border-radius:8px;padding:0.45rem 1rem;color:var(--accent);font-size:0.8rem;font-weight:600;cursor:pointer;text-decoration:none;transition:all 0.2s;font-family:'DM Sans',sans-serif;}
  .btn-sm:hover{background:rgba(79,142,247,0.2);}
  .container{max-width:800px;margin:0 auto;padding:2rem 1.5rem;position:relative;z-index:1;}
  .page-title{font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;margin-bottom:0.5rem;}
  .page-sub{color:var(--muted);font-size:0.9rem;margin-bottom:2rem;}

  /* Config card */
  .config-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:2rem;margin-bottom:2rem;}
  .config-card h3{font-family:'Syne',sans-serif;font-size:1rem;font-weight:700;margin-bottom:1.25rem;}
  .input-row{display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:end;}
  .form-group{display:flex;flex-direction:column;gap:0.4rem;}
  .form-group label{font-size:0.8rem;color:var(--muted);}
  .form-group select,.form-group input{
    background:rgba(255,255,255,0.04);border:1px solid var(--border);
    border-radius:10px;padding:0.65rem 1rem;color:var(--text);
    font-size:0.9rem;font-family:'DM Sans',sans-serif;transition:border-color 0.2s;
  }
  .form-group select option{background:#0b1120;}
  .form-group select:focus,.form-group input:focus{outline:none;border-color:var(--accent);}
  .btn-generate{
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;border-radius:12px;padding:0.7rem 1.75rem;
    color:#fff;font-family:'Syne',sans-serif;font-weight:700;font-size:0.95rem;
    cursor:pointer;white-space:nowrap;transition:all 0.3s;
  }
  .btn-generate:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 30px rgba(79,142,247,0.4);}
  .btn-generate:disabled{opacity:0.5;cursor:not-allowed;}

  /* Q Cards */
  .q-count{color:var(--muted);font-size:0.85rem;margin-bottom:1rem;}
  .q-card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:16px;padding:1.5rem;margin-bottom:1rem;
    transition:border-color 0.2s;
  }
  .q-card:hover{border-color:rgba(79,142,247,0.25);}
  .q-header{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:0.75rem;}
  .q-num{
    font-family:'Syne',sans-serif;font-size:0.75rem;font-weight:700;
    background:rgba(79,142,247,0.1);border:1px solid rgba(79,142,247,0.2);
    border-radius:100px;padding:0.2rem 0.6rem;color:var(--accent);white-space:nowrap;
  }
  .diff-badge{
    font-size:0.7rem;font-weight:600;padding:0.2rem 0.6rem;border-radius:100px;white-space:nowrap;
  }
  .diff-Easy{background:rgba(52,211,153,0.1);color:var(--green);}
  .diff-Medium{background:rgba(251,146,60,0.1);color:var(--orange);}
  .diff-Hard{background:rgba(248,113,113,0.1);color:var(--red);}
  .q-text{font-size:0.95rem;line-height:1.6;font-weight:500;flex:1;}
  .q-category{font-size:0.75rem;color:var(--muted);margin-bottom:0.5rem;}
  .q-hint{
    background:rgba(79,142,247,0.05);border:1px solid rgba(79,142,247,0.12);
    border-radius:8px;padding:0.6rem 0.875rem;
    font-size:0.8rem;color:var(--accent);line-height:1.5;
    display:none;
  }
  .q-hint.show{display:block;}
  .q-hint-btn{
    background:none;border:none;color:var(--muted);font-size:0.75rem;
    cursor:pointer;margin-top:0.5rem;font-family:'DM Sans',sans-serif;
    transition:color 0.2s;
  }
  .q-hint-btn:hover{color:var(--accent);}

  /* Empty / loading */
  .empty{text-align:center;padding:4rem 2rem;color:var(--muted);}
  .empty-icon{font-size:3rem;margin-bottom:1rem;display:block;}
  .spinner{display:inline-block;width:20px;height:20px;border:2px solid rgba(79,142,247,0.3);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin-right:0.5rem;vertical-align:middle;}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .q-card{animation:fadeIn 0.4s ease both;}
</style>
</head>
<body>
<nav>
  <div class="logo">ResumeIQ</div>
  <div style="display:flex;gap:0.75rem">
    <a href="/dashboard" class="btn-sm">← Dashboard</a>
    <a href="/market" class="btn-sm">Market Pulse</a>
  </div>
</nav>

<div class="container">
  <div class="page-title">🎤 AI Interview Coach</div>
  <div class="page-sub">Get tailored interview questions generated from your resume's skill profile</div>

  <div class="config-card">
    <h3>Configure Your Session</h3>
    <div class="input-row">
      <div class="form-group">
        <label>Target Role</label>
        <select id="roleSelect">
          <option value="Data Scientist">Data Scientist</option>
          <option value="ML Engineer">ML Engineer</option>
          <option value="Data Analyst">Data Analyst</option>
          <option value="Data Engineer">Data Engineer</option>
          <option value="Backend Developer (Python)">Backend Developer (Python)</option>
          <option value="GenAI / LLM Engineer">GenAI / LLM Engineer</option>
          <option value="DevOps / MLOps Engineer">DevOps / MLOps Engineer</option>
          <option value="NLP Engineer">NLP Engineer</option>
          <option value="Full-Stack Developer">Full-Stack Developer</option>
          <option value="Cloud Solutions Architect">Cloud Solutions Architect</option>
        </select>
      </div>
      <div class="form-group">
        <label>No. of Questions</label>
        <input type="number" id="numQ" value="8" min="3" max="20" style="width:100px" />
      </div>
      <button class="btn-generate" id="genBtn" onclick="generateQuestions()">Generate ✨</button>
    </div>
  </div>

  <div id="qSection">
    <div class="empty">
      <span class="empty-icon">🎯</span>
      <p>Select a role and hit Generate to get your personalised question set</p>
    </div>
  </div>
</div>

<script>
async function generateQuestions() {
  const resumeId = sessionStorage.getItem('resumeId');
  const role     = document.getElementById('roleSelect').value;
  const numQ     = parseInt(document.getElementById('numQ').value) || 8;
  const genBtn   = document.getElementById('genBtn');
  const qSection = document.getElementById('qSection');

  genBtn.disabled  = true;
  genBtn.innerHTML = '<span class="spinner"></span> Generating…';
  qSection.innerHTML = `<div class="empty"><span class="empty-icon">🤖</span><p>AI is crafting questions based on your resume…</p></div>`;

  try {
    let questions;

    if (resumeId) {
      // Real API call if resume was analyzed
      const res  = await fetch(`/api/coach/${resumeId}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ target_role: role, num_questions: numQ })
      });
      const data = await res.json();
      questions  = data.questions || [];
    } else {
      // Demo fallback
      questions = getDemoQuestions(role, numQ);
    }

    renderQuestions(questions, role);
  } catch (err) {
    qSection.innerHTML = `<div class="empty"><p>Error generating questions. Please try again.</p></div>`;
  } finally {
    genBtn.disabled  = false;
    genBtn.innerHTML = 'Generate ✨';
  }
}

function renderQuestions(questions, role) {
  const qSection = document.getElementById('qSection');
  if (!questions.length) {
    qSection.innerHTML = '<div class="empty"><p>No questions generated. Please try again.</p></div>';
    return;
  }
  let html = `<div class="q-count">${questions.length} questions for <strong>${role}</strong></div>`;
  questions.forEach((q, i) => {
    const diff    = q.difficulty || 'Medium';
    const cat     = q.category   || 'Technical';
    const hint    = q.hint       || 'Think about a concrete example from your experience.';
    html += `
      <div class="q-card" style="animation-delay:${i*0.06}s">
        <div class="q-header">
          <div>
            <div class="q-category">${cat}</div>
            <div class="q-text">Q${i+1}. ${q.q}</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:0.4rem;flex-shrink:0">
            <span class="q-num">#${i+1}</span>
            <span class="diff-badge diff-${diff}">${diff}</span>
          </div>
        </div>
        <div class="q-hint" id="hint-${i}">💡 ${hint}</div>
        <button class="q-hint-btn" onclick="toggleHint(${i})">Show hint ▾</button>
      </div>`;
  });
  qSection.innerHTML = html;
}

function toggleHint(i) {
  const hint = document.getElementById(`hint-${i}`);
  const btn  = hint.nextElementSibling;
  hint.classList.toggle('show');
  btn.textContent = hint.classList.contains('show') ? 'Hide hint ▴' : 'Show hint ▾';
}

function getDemoQuestions(role, n) {
  const bank = [
    {q:`Walk me through a project where you applied ${role} skills end-to-end.`, difficulty:'Medium', category:'Behavioral', hint:'Cover problem, approach, tools used, outcome, and what you learned.'},
    {q:'Explain the bias-variance tradeoff with a practical example.', difficulty:'Medium', category:'Technical', hint:'Start with definitions, then link to underfitting/overfitting.'},
    {q:'How would you handle a dataset with 40% missing values?', difficulty:'Hard', category:'Technical', hint:'Cover imputation strategies, domain context, and model-based approaches.'},
    {q:'Describe a time you disagreed with a technical decision in your team.', difficulty:'Medium', category:'Behavioral', hint:'Focus on how you raised the concern constructively and the outcome.'},
    {q:'What is the difference between SQL window functions and GROUP BY?', difficulty:'Medium', category:'Technical', hint:'Window functions preserve row-level detail; GROUP BY collapses rows.'},
    {q:'How do you deploy a machine learning model to production safely?', difficulty:'Hard', category:'System Design', hint:'Cover model versioning, A/B testing, monitoring, rollback strategy.'},
    {q:'What evaluation metrics would you use for an imbalanced classification problem?', difficulty:'Medium', category:'Technical', hint:'AUC-ROC, F1-score, precision-recall curve — avoid accuracy alone.'},
    {q:'How would you scale a Flask API to handle 10,000 requests/second?', difficulty:'Hard', category:'System Design', hint:'Discuss async, load balancing, caching, database connection pools.'},
    {q:`Where do you see ${role} skills heading in the next 2 years?`, difficulty:'Easy', category:'Domain', hint:'Show market awareness and continuous learning mindset.'},
    {q:'Tell me about a failure in a technical project and what you learned.', difficulty:'Medium', category:'Behavioral', hint:'Be honest, focus on the lesson, and demonstrate growth.'},
  ];
  return bank.slice(0, n);
}
</script>
</body>
</html>
