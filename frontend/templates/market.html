<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ResumeIQ — Real-Time Market Pulse</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{--bg:#040711;--surface:#0b1120;--surface2:#111827;--border:rgba(255,255,255,0.07);--accent:#4f8ef7;--accent2:#a78bfa;--green:#34d399;--orange:#fb923c;--text:#e2e8f0;--muted:#64748b;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);}
  body::before{content:'';position:fixed;inset:0;z-index:0;background-image:linear-gradient(rgba(79,142,247,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(79,142,247,0.03) 1px,transparent 1px);background-size:60px 60px;pointer-events:none;}
  nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:1rem 2.5rem;backdrop-filter:blur(20px);background:rgba(4,7,17,0.85);border-bottom:1px solid var(--border);}
  .logo{font-family:'Syne',sans-serif;font-size:1.3rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .btn-sm{background:rgba(79,142,247,0.1);border:1px solid rgba(79,142,247,0.25);border-radius:8px;padding:0.45rem 1rem;color:var(--accent);font-size:0.8rem;font-weight:600;cursor:pointer;text-decoration:none;transition:all 0.2s;}
  .btn-sm:hover{background:rgba(79,142,247,0.2);}
  .container{max-width:1100px;margin:0 auto;padding:2rem 1.5rem;position:relative;z-index:1;}
  .page-title{font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;margin-bottom:0.5rem;}
  .page-sub{color:var(--muted);font-size:0.9rem;margin-bottom:2rem;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:1.5rem;}
  @media(max-width:700px){.grid2{grid-template-columns:1fr;}}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:1.75rem;}
  .card-title{font-family:'Syne',sans-serif;font-size:1rem;font-weight:700;margin-bottom:1.25rem;display:flex;align-items:center;gap:0.5rem;}

  /* trend bars */
  .trend-row{display:flex;align-items:center;gap:1rem;margin-bottom:0.85rem;}
  .trend-skill{font-size:0.82rem;width:160px;flex-shrink:0;}
  .trend-bar-bg{flex:1;height:8px;background:rgba(255,255,255,0.06);border-radius:100px;overflow:hidden;}
  .trend-bar{height:100%;border-radius:100px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
  .trend-growth{font-size:0.72rem;color:var(--green);width:60px;text-align:right;flex-shrink:0;}

  /* roles table */
  .role-row{display:flex;align-items:center;justify-content:space-between;padding:0.75rem;border-radius:10px;background:var(--surface2);border:1px solid var(--border);margin-bottom:0.5rem;}
  .role-name{font-size:0.85rem;font-weight:500;}
  .role-stats{display:flex;gap:1.5rem;}
  .role-stat{font-size:0.75rem;color:var(--muted);}
  .role-stat strong{color:var(--text);}

  /* match your skills */
  .match-section{margin-top:1.5rem;}
  .match-title{font-family:'Syne',sans-serif;font-size:1rem;font-weight:700;margin-bottom:1rem;}
  .match-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:0.75rem;}
  .match-card{background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:1rem;}
  .match-skill{font-size:0.8rem;font-weight:600;margin-bottom:0.4rem;}
  .match-bar-bg{height:4px;background:rgba(255,255,255,0.06);border-radius:100px;overflow:hidden;}
  .match-bar{height:100%;border-radius:100px;}
  .match-label{font-size:0.7rem;color:var(--muted);margin-top:0.3rem;}

  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .card{animation:fadeIn 0.5s ease both;}
</style>
</head>
<body>
<nav>
  <div class="logo">ResumeIQ</div>
  <div style="display:flex;gap:0.75rem">
    <a href="/dashboard" class="btn-sm">← Dashboard</a>
    <a href="/" class="btn-sm">+ New Resume</a>
  </div>
</nav>
<div class="container">
  <div class="page-title">📈 Real-Time Market Pulse</div>
  <div class="page-sub">Live demand trends for skills and roles — updated monthly from job board data</div>

  <div class="grid2">
    <div class="card">
      <div class="card-title">🔥 Trending Skills by Demand</div>
      <div id="trendBars"></div>
    </div>
    <div class="card">
      <div class="card-title">📊 Monthly Job Openings Trend</div>
      <canvas id="monthlyChart" height="220"></canvas>
    </div>
  </div>

  <div class="card" style="margin-bottom:1.5rem">
    <div class="card-title">💼 Top Roles by Current Openings</div>
    <div id="roleRows"></div>
  </div>

  <!-- Your skills vs market -->
  <div class="card match-section">
    <div class="match-title">🎯 Your Skills vs Market Demand</div>
    <div class="match-grid" id="matchGrid"></div>
  </div>
</div>

<script>
const API = '/api/market';

async function load() {
  const res  = await fetch(API);
  const data = await res.json();

  // Trending skill bars
  const tb = document.getElementById('trendBars');
  data.trending_skills.forEach(({ skill, demand_score, yoy_growth }) => {
    tb.innerHTML += `
      <div class="trend-row">
        <div class="trend-skill">${skill}</div>
        <div class="trend-bar-bg"><div class="trend-bar" style="width:${demand_score}%"></div></div>
        <div class="trend-growth">${yoy_growth}</div>
      </div>`;
  });

  // Monthly chart
  const mctx = document.getElementById('monthlyChart').getContext('2d');
  new Chart(mctx, {
    type: 'bar',
    data: {
      labels: data.monthly_job_trend.map(d => d.month),
      datasets: [{
        data: data.monthly_job_trend.map(d => d.openings),
        backgroundColor: 'rgba(79,142,247,0.3)',
        borderColor: '#4f8ef7',
        borderWidth: 2,
        borderRadius: 6,
      }]
    },
    options: {
      scales: {
        y: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#64748b', callback: v => (v/1000)+'k' }},
        x: { grid: { display: false }, ticks: { color: '#64748b' }}
      },
      plugins: { legend: { display: false }}
    }
  });

  // Role rows
  const rr = document.getElementById('roleRows');
  data.top_roles_by_openings.forEach(({ role, openings, avg_salary }) => {
    rr.innerHTML += `
      <div class="role-row">
        <div class="role-name">${role}</div>
        <div class="role-stats">
          <div class="role-stat">Openings <strong>${openings.toLocaleString()}</strong></div>
          <div class="role-stat">Avg Salary <strong>${avg_salary}</strong></div>
        </div>
      </div>`;
  });

  // Your skills vs market
  const resumeData = JSON.parse(sessionStorage.getItem('resumeiqData') || '{}');
  const mySkills   = new Set((resumeData.scores?.skills_found || []));
  const mg = document.getElementById('matchGrid');
  data.trending_skills.forEach(({ skill, demand_score }) => {
    const have   = mySkills.has(skill.toLowerCase());
    const color  = have ? '#34d399' : '#f87171';
    const label  = have ? '✅ You have this' : '❌ Not in your resume';
    mg.innerHTML += `
      <div class="match-card">
        <div class="match-skill">${skill}</div>
        <div class="match-bar-bg"><div class="match-bar" style="width:${demand_score}%;background:${color}"></div></div>
        <div class="match-label">${label}</div>
      </div>`;
  });
}

load();
</script>
</body>
</html>
